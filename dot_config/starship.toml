add_newline = false
format = "$username$directory$git_branch$git_status$character"

[character]
success_symbol = ">"
error_symbol = ">"

[username]
show_always = true
format = "[$user]($style) "

[directory]
truncation_length = 2
truncate_to_repo = true

[git_branch]
symbol = ""

[git_status]
format = "([$conflicted$stashed$deleted$renamed$modified$staged$untracked$ahead_behind]($style) )"
conflicted = "="
stashed = "$"
deleted = "x"
renamed = "R"
modified = "!"
staged = "+"
untracked = "?"
ahead = ">"
behind = "<"
diverged = "<>"
