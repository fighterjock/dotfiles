# tmux config: minimal, ASCII-only, vi keys, no plugin manager

# prefix: C-a (screen-style; the C-b reach is painful on Dvorak)
# C-a C-a sends C-a through to the running program
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# terminal integration
set -g default-terminal "tmux-256color"
# advertise true color only when the outer terminal supports it
# (Apple Terminal is 256-color only; forwarding 24-bit SGR breaks colors there)
if-shell '[ -n "$COLORTERM" ]' 'set -ga terminal-overrides ",*:Tc"'
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
set -g history-limit 50000
set -g mouse on

# behavior
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g automatic-rename on
set -g set-titles on
setw -g mode-keys vi

# splits and windows open in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# pane navigation (repeatable)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# pane resize (repeatable, shift-hjkl)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window switching without the prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left previous-window
bind -n M-Right next-window

# copy mode: v selects, y copies to the system clipboard (via OSC52)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# reload with prefix-r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# theme: catppuccin mocha, matching the neovim colorscheme
# base #1e1e2e, surface0 #313244, surface1 #45475a, overlay0 #6c7086,
# subtext0 #a6adc8, text #cdd6f4, mauve #cba6f7, red #f38ba8
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[fg=#cba6f7,bold]#S #[fg=#45475a]| "
set -g status-right "#[fg=#6c7086]%a %d %b #[fg=#cdd6f4]%H:%M "
set -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086]#I:#W"
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#cba6f7,bold]#I:#W"
setw -g window-status-activity-style "bg=#1e1e2e,fg=#f38ba8"
setw -g window-status-bell-style "bg=#1e1e2e,fg=#f9e2af"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "fg=#1e1e2e,bg=#cba6f7"
set -g message-command-style "fg=#1e1e2e,bg=#cba6f7"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
